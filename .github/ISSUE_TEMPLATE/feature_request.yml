name: Feature request
description: Suggest an improvement or new capability for randwallpaper
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first so the proposed solution has context.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see, including CLI or API usage if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you have tried.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, references, or notes on how this affects existing behaviour.
    validations:
      required: false
